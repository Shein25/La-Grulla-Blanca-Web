name: Publicar La Grulla Blanca Web

on:
  push:
    branches: [main]
    paths:
      - WEB_GRULLA_PUBLICAR_EN_GITHUB.zip
      - .github/workflows/publicar-web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-la-grulla
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar y preparar web R2-R18
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos de publicación
        uses: actions/checkout@v4

      - name: Extraer solo la distribución compilada
        run: |
          set -euo pipefail
          test -f WEB_GRULLA_PUBLICAR_EN_GITHUB.zip || { echo "::error::Falta WEB_GRULLA_PUBLICAR_EN_GITHUB.zip en la raíz"; exit 1; }
          mkdir -p "$RUNNER_TEMP/grulla-web"
          unzip -q WEB_GRULLA_PUBLICAR_EN_GITHUB.zip -d "$RUNNER_TEMP/grulla-web"

      - name: Verificar integridad y ausencia de archivos de desarrollo
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'grulla-web'
          manifest=json.loads((root/'MANIFIESTO_SHA256.json').read_text(encoding='utf-8'))
          assert manifest['schema']=='LGB_MODULAR_HASHES_V1'
          files=manifest['files']
          assert len(files)==331, f'Se esperaban 331 archivos: {len(files)}'
          for name,expected in files.items():
              candidate=(root/name).resolve()
              assert candidate.is_relative_to(root.resolve()), name
              assert candidate.is_file(), name
              assert hashlib.sha256(candidate.read_bytes()).hexdigest()==expected, name
          assert (root/'index.html').is_file()
          runtime=json.loads((root/'runtime-manifest.json').read_text(encoding='utf-8'))
          assert runtime['schema']=='LGB_MODULAR_RUNTIME_V1'
          assert runtime['worldActivation'] is False
          assert not (root/'node_modules').exists()
          assert not (root/'.git').exists()
          (root/'.nojekyll').touch(exist_ok=True)
          print('PASS: 331 archivos verificables, aplicacion modular R2-R18 lista')
          PY

      - name: Subir exclusivamente los archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/grulla-web

  publicar:
    name: Activar GitHub Pages y desplegar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publicar web
        id: deploy
        uses: actions/deploy-pages@v4
