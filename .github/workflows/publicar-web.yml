name: Preparar juego compilado para GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - WEB_GRULLA_PUBLICAR_EN_GITHUB.zip
      - .github/workflows/publicar-web.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preparar-grulla-web
  cancel-in-progress: false

jobs:
  verificar-y-publicar:
    name: Verificar 331 archivos y guardar juego web en main
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio publico
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extraer ZIP original en carpeta temporal
        run: |
          set -euo pipefail
          test -f WEB_GRULLA_PUBLICAR_EN_GITHUB.zip
          mkdir -p "$RUNNER_TEMP/grulla-web"
          unzip -q WEB_GRULLA_PUBLICAR_EN_GITHUB.zip -d "$RUNNER_TEMP/grulla-web"

      - name: Verificar integridad y seguridad basica de distribucion
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = (Path(os.environ["RUNNER_TEMP"])/"grulla-web").resolve()
          manifest = json.loads((root/"MANIFIESTO_SHA256.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "LGB_MODULAR_HASHES_V1"
          expected = manifest["files"]
          assert len(expected) == 331, f"Conteo inesperado: {len(expected)}"
          for relative, sha in expected.items():
              path = (root/relative).resolve()
              assert path.is_relative_to(root), relative
              assert path.is_file(), relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == sha, relative
          runtime = json.loads((root/"runtime-manifest.json").read_text(encoding="utf-8"))
          assert runtime["schema"] == "LGB_MODULAR_RUNTIME_V1"
          assert runtime["worldActivation"] is False
          assert (root/"index.html").is_file()
          for unwanted in (".git", "node_modules", "project", "tests", "sources", "backups", ".env"):
              assert not (root/unwanted).exists(), unwanted
          print("PASS: 331/331 distribucion modular R2-R18")
          PY

      - name: Instalar solo los archivos web en raiz publica
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/grulla-web"/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll index.html runtime-manifest.json MANIFIESTO_SHA256.json assets data rituals
          if git diff --cached --quiet; then
            echo "El sitio ya estaba actualizado."
          else
            git commit -m "Publica juego modular R2-R18 verificado para Pages"
            git push origin HEAD:main
          fi
