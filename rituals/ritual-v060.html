<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const mix=(v,salt)=>{let x=(v^salt)>>>0;x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);return(x^(x>>>16))>>>0};
const requested=new URLSearchParams(location.search).get('semilla');
const randomSeed=()=>{try{let x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]>>>0}catch{return Math.floor(Math.random()*0x100000000)>>>0}};
const params={seed:requested!==null && /^\d+$/.test(requested)?Number(requested)>>>0:randomSeed(),stage:1,realm:'LianQi II',aliento:null,resonancia:null,dantian:null,stageSeeds:[]};
const stageSeeds=()=>[params.seed%216,mix(params.seed,0x1f9422d5),mix(params.seed,0x88e41c6a)];
const sourceCache=[];
for(let i=1;i<=3;i++){const data=atob($('phase'+i+'-source').textContent);const bytes=Uint8Array.from(data,x=>x.charCodeAt(0));sourceCache.push(new TextDecoder().decode(bytes))}
let ready=false,stageLock=false,checkHandle=null;
function updateNav(){for(let i=1;i<=3;i++)$('chap'+i).className=i===params.stage?'active':i<params.stage?'done':''}
function boot(i){
 clearInterval(checkHandle);stageLock=false;ready=false;params.stage=i;updateNav();$('overlay').hidden=true;
 const preload='<script>window.__LAB_SEED='+params.stageSeeds[i-1]+';window.__LAB_HANDOFF='+JSON.stringify(i===2?{qi:params.aliento?.qi}:i===3?{essence:params.resonancia?.essence}:{})+';<\/script>';
 const src=sourceCache[i-1].replace('</head>',preload+'</head>');
 $('game').srcdoc=src;
 $('game').onload=()=>{ready=true};
 checkHandle=setInterval(check,140);
}
function show(kind,data){
 stageLock=true;clearInterval(checkHandle);
 const o=$('overlay');const proceed=$('proceed');const reset=$('reset');
 let glyph,eyebrow,title,desc,detail,label;
 if(kind==='stage1'){
  glyph='氣';eyebrow='FASE I SUPERADA';title='El aliento ha despertado';desc='Las cuatro posturas estabilizaron tu reserva. El Qi reunido alimentará los cuatro sellos de la Cámara de Resonancia.';
  detail='<strong>'+data.qi+' Qi</strong> transferido · Estabilidad '+data.st+' · Calor '+data.heat+' · Turbulencia '+data.turb;label='Entrar en la Cámara de Resonancia';
  proceed.onclick=()=>boot(2);
 }else if(kind==='stage2'){
  glyph='圓';eyebrow='FASE II SUPERADA';title='Los cuatro sellos responden';desc='La esencia refinada comienza a cristalizar. La Flor de Jade recibirá una reserva inicial equilibrada por las leyes de este laboratorio.';
  const startEss=68+Math.min(16,Math.max(0,data.essence-64));
  detail='<strong>'+data.essence+' esencia</strong> refinada · Reserva condensada '+startEss+' · Qi restante '+data.qi+' · Tensión '+data.strain;
  label='Iniciar la Ruptura del Dantian';proceed.onclick=()=>boot(3);
 }else if(kind==='victory'){
  glyph='✧';eyebrow='LOS TRES UMBRALES SUPERADOS';title='LianQi III';desc='El Dantian se abre sin fracturarse. La Flor de Jade despliega sus pétalos y el Qi atraviesa el tercer umbral. ¡Has completado el ritual de ascenso!';
  detail='<strong>Reino alcanzado en el ritual: LianQi III</strong> · '+data.light+' luces · '+data.seals+' sellos · Esencia '+data.ess+' · Presión '+data.pressure;
  label='Contemplar el florecimiento';proceed.onclick=()=>{try{$('game').contentWindow.document.querySelector('#modal').hidden=true}catch(e){}o.hidden=true};
  reset.textContent='Nuevo ritual de cultivación';
 }else{
  glyph='息';eyebrow='RITUAL INTERRUMPIDO';title='El Qi necesita otra oportunidad';desc='La fase '+params.stage+' no superó sus objetivos. La próxima meditación comenzará desde las cuatro posturas del aliento.';
  detail=data;label='Intentar el ritual completo de nuevo';proceed.onclick=()=>restart();reset.hidden=true;
 }
 $('symbol').textContent=glyph;$('eyebrow').textContent=eyebrow;$('stageTitle').textContent=title;$('stageDescription').textContent=desc;$('details').innerHTML=detail;$('proceed').textContent=label;
 if(kind!=='failure'){reset.hidden=kind==='stage1'||kind==='stage2';reset.textContent='Nuevo ritual de cultivación';reset.onclick=()=>restart()}
 o.hidden=false;proceed.focus({preventScroll:true});
}
function check(){if(stageLock||!ready)return;
 let api;try{const w=$('game').contentWindow;api=params.stage===1?w.RITUAL_UI_V053:params.stage===2?w.RESONANCIA_QA:w.__LGBIII;if(!api)return;
 if(params.stage===1){let a=api.snapshot();if(!a.result)return;if(!a.result.ok){show('failure','Qi '+a.state.qi+' · Estabilidad '+a.state.st+' · Calor '+a.state.heat+' · Turbulencia '+a.state.turb);return}params.aliento={...a.state};show('stage1',a.state)}
 else if(params.stage===2){let b=api.snapshot();if(!b.result)return;if(b.result!=='success'){show('failure','Esencia '+b.essence+' · Qi '+b.qi+' · Tensión '+b.strain);return}params.resonancia={qi:b.qi,essence:b.essence,strain:b.strain,focus:b.focus};show('stage2',b)}
 else {let c=api.getState();if(c.status==='playing')return;if(c.status!=='won'){show('failure','Luces '+c.light+'/3 · Sellos '+c.seals+'/2 · Esencia '+c.ess+' · Presión '+c.pressure);return}params.dantian={ess:c.ess,pressure:c.pressure,integrity:c.integrity,light:c.light,seals:c.seals};params.realm='LianQi III';window.dispatchEvent(new CustomEvent('lgb:ritual-completado',{detail:{reino:'LianQi III',seed:params.seed,fases:{aliento:params.aliento,resonancia:params.resonancia,dantian:params.dantian},persistidoEnCampana:false}}));stageLock=true;clearInterval(checkHandle);setTimeout(()=>show('victory',c),1550)}
 }catch(e){console.error('Error de enlace entre fases:',e);}
}
function restart(){params.seed=(params.seed+0x9e3779b9)>>>0;params.stageSeeds=stageSeeds();params.aliento=null;params.resonancia=null;params.dantian=null;params.realm='LianQi II';boot(1)}
params.stageSeeds=stageSeeds();
window.RITUAL_INTEGRADO_QA=Object.freeze({snapshot:()=>JSON.parse(JSON.stringify(params)),restart,stageWindow:()=>$('game').contentWindow});
boot(1);
})();
</script></body></html>
